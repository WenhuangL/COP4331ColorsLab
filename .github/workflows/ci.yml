name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        if: ${{ !cancelled() }}
        run: npm run lint:css

      - name: Lint JavaScript
        if: ${{ !cancelled() }}
        run: npm run lint:js

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js (test tools only)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (front-end JS)
        run: npm run test:unit

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli
          coverage: none

      - name: Start MySQL and load test data
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot < tests/fixtures/seed.sql

      - name: Start PHP API server
        run: |
          php -S 127.0.0.1:8000 -t api > php-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8000/Login.php && exit 0
            sleep 1
          done
          echo "PHP server did not start"
          cat php-server.log
          exit 1

      - name: Integration tests (PHP API + MySQL)
        run: npm run test:integration

      - name: Show PHP server log
        if: failure()
        run: cat php-server.log
